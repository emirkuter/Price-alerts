name: 4-Hour Stock Alerts

on:
  push:
    branches: [main]
    paths:
      - main.py
      - test_main.py
      - trade_strategy.py
      - test_trade_strategy.py
      - supertrend_alerts.py
      - test_supertrend_alerts.py
      - config.json
      - .github/workflows/alerts.yml
  schedule:
    # Two crypto pairs per 15m slot (all 30 covered about every 4h); US stocks after bar closes.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to do?
        required: true
        default: test
        type: choice
        options:
          - chat-id
          - test
          - scan
          - diagnose
          - diagnose-crypto

permissions:
  contents: write

concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  alerts:
    # Scheduled scans are ON by default; ALERTS_ENABLED=false explicitly pauses them.
    if: ${{ github.event_name != 'schedule' || vars.ALERTS_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check indicators, paper strategy, and Supertrend reversals
        run: python -m unittest -q test_main test_trade_strategy test_supertrend_alerts
      - name: Run selected mode with Supertrend for scheduled/manual scans
        env:
          MODE: ${{ github.event_name == 'push' && 'diagnose-crypto' || github.event.inputs.mode || 'scan' }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python supertrend_alerts.py --mode "$MODE"
      - name: Commit processed-candle state
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'scan' }}
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: mark evaluated stock candles [skip ci]"
            git push
          fi
